# PEP 621 compliant file for project metadata
# See here for more information:
# https://packaging.python.org/en/latest/specifications/declaring-project-metadata/#declaring-project-metadata
# https://www.python.org/dev/peps/pep-0621/

[build-system]
build-backend = "hatchling.build"

requires = [ "hatch-vcs", "hatchling" ]

[project]
name = "landloss"
description = "NHC land loss"
authors = [
  { name = "Tonkin & Taylor Limited", email = "Sub-DisciplineData+AnalyticsStaff@tonkintaylor.co.nz" },
]
license = { file = "LICENSE.txt" }
readme = "README.md"
requires-python = ">=3.13"
dynamic = ["version"]
dependencies = [
    "contextily>=1.6",
    "geopandas>=1.1.1",
    "linz-stac-utils>=0.1",
    "matplotlib>=3.10.3",
    "matplotlib-map-utils>=3.0",
    "matplotlib-scalebar>=0.9",
    "numpy>=2.1",
    "pandas>=2.3",
    "pyarrow>=19.0",
    "pyproj>=3.7",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "rasterio>=1.4",
    "requests>=2.32",
    "rioxarray>=0.19",
    "scipy>=1.14",
    "shapely>=2.1.1",
    "ttpy-gis",
    "xarray>=2025.1",
]

[dependency-groups]
dev = [
    "build>=1.2.2",
    "deptry>=0.23.0",
    "flake8-dunder-all>=0.4.1",
    "ipykernel>=6.29.5",
    "ipython>=9.3.0",
    "ipywidgets>=8.1.7",
    "nbstripout>=0.8.1",
    "notebook>=6.5.4",
    "openpyxl>=3.1.5",
    "prek>=0.3.10",
    "ruff>=0.12.0",
    "sync-with-uv>=0.5.0",
    "tqdm>=4.67.1",
    "validate-pyproject>=0.23",
]
test = [
    "coverage[toml]>=7.9.1",
    "pytest>=8.4.0",
    "pytest-cov>=6.1.1",
]
doc = [
    "gitpython>=3.1.44",
    "mkdocs-api-autonav>=0.4.0",
    "mkdocs-material>=9.6.0",
    "mkdocstrings-python>=1.16.0",
    "tomli>=2.2.1",
    "towncrier>=25.8.0",
]
uv = [ "uv==0.10.2" ]

[project.scripts]
# example = "landloss.scripts.example:myfunc"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/landloss/_version.py"

[tool.hatch.build.targets.wheel]
sources = [ "src" ]
packages = [ "src/landloss", "src/tdrive_sync" ]

[tool.uv]
default-groups = ["dev", "test", "doc"]
required-version = ">=0.10.2"
link-mode = "copy"
exclude-newer = "7 days"
exclude-newer-package = { rastr = false, ruru = false }

[tool.uv.sources]
ttpy-gis = { git = "ssh://git@bitbucket.org/tonkintaylor/ttpy-gis", rev = "5df8d8725a9ca58bfbdccc666a6a4a456317c021" }

[tool.towncrier]
directory = "doc/whatsnew"
package_dir = "src"
title_format = "{version} ({project_date})"
filename = "CHANGELOG.md"
# Fragments are named `{initials}.{type}.{yymmddhhmm}.md` so two people or two branches
# never pick the same name. Add a new contributor's initials here; see AGENTS.md.
issue_pattern = "mm|pg"
# Also see the `[[tool.towncrier.type]]` sections near the bottom of the file.

[tool.ruff]
src = ["src"]
include = ["*.py", "*.pyi", "**/pyproject.toml", "*.ipynb"]
line-length = 88
# Research scripts are exploratory and unmaintained, so they are not linted or
# formatted; see "Research scripts" in AGENTS.md.
extend-exclude = ["src/**/_version.py", "src/archive/**", "src/scripts/**/research/**"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  # ##############################
  # The following rules trade-off code quality for performance.
  # In some cases where your code is poorly-performing you might want to enable them again.
  # ##############################
  "PD101",   # Harms readability for a performance optimization.
  "PERF203", # Too many false positives.
  "PERF401", # This can hurt readability; the performance is not always worth it.
  # ##############################
  # The following rules are disabled for general reasons.
  # ##############################
  "ANN401",  # This is too strict for dunder methods.
  "B023",    # Prevents using df.loc[lambda _: ...]; too many false positives.
  "B024",    # This is controversial, ABC's don't always need methods.
  "C901",    # Too complex; parsers and data pipelines are naturally branchy
  "C408",   # This is controversial, calls to `dict` can be more idiomatic than {}.
  "COM812",  # Incompatible with the ruff formatter.
  "D100",    # Too excessive for our purposes (Docstring in public module).
  "D105",    # This is controversial, we don't always need docstrings for magic methods.
  "D107",    # This is controversial, we don't always need docstrings for magic methods.
  "D202",    # This is controversial, it is useful to have a blank line after a docstring.
  "D203",    # This is controversial, no need to have a blank line before a docstring.
  "D213",    # This conflicts with D212 and violates PEP 257.
  "D406",    # This rule is for non-Google style docstrings.
  "D407",    # This rule is for non-Google style docstrings.
  "D408",    # This rule is for non-Google style docstrings.
  "D409",    # This rule is for non-Google style docstrings.
  "D415",    # Too excessive for our purposes (Docstring ending in punctuation).
  "G004",    # This is controversial, f-strings are too convenient to avoid.
  "TD003",   # Too excessive for our purposes (TDO Links).
  "ISC001",  # Incompatible with the ruff formatter.
  "PIE804",  # This is controversial, some pandas APIs work better with dict approach.
  "PLR0912", # Too many branches; the companion to C901
  "PLR0915", # Too many statements; the companion to C901
  "PLR0913", # Too many arguments; long argument lists are normal for models and plotting
  "PLR0917", # Too many positional arguments; the companion to PLR0913
  "PLR2004", # Too strict for exploratory work
  "PLW2901", # Too many false positives.
  "PT003",   # Explicit is better than implicit
  "PTH",     # These are often overly pedantic, has no autofixes, and AI violates often
  "RET504",  # This is controversial, named returns are often clearer.
  "RET505",  # This is controversial, returns within ``else`` are often clearer.
  "RET506",  # This is controversial, explicit branch structure is often clearer.
  "S105",    # Too many false positives.
  "S311",    # Too many false positives in a data science context.
  "S324",    # Too many false positives.
  "S603",    # Too many false positives.
  "SIM105",  # This harms refactorability, is slower, and increases learning curve.
  "SIM108",  # This is controversial, the ternary operator is not always clearer.
  "SIM118",  # This is controversial, sometimes .keys() explicitly is clearer.
  "TC001",   # Too many false positives.
  "TC002",   # Too many false positives.
  "TC003",   # Too many false positives.
  "TD",      # These rules don't align well with the way we use TODOs.
  "UP015",   # This is controversial, explicit is better than implicit.
  "UP040",   # This doesn't integrate well with pydantic.
    "CPY001", # not needed
]
allowed-confusables = ["–", "σ", "ℹ", "α", "γ"]
flake8-tidy-imports.banned-api."pytz".msg = "'zoneinfo' should be preferred to 'pytz' when using Python 3.9 and later, see https://tonkintaylor-sonarqube.azurewebsites.net/coding_rules?open=python%3AS6890&rule_key=python%3AS6890"
flake8-tidy-imports.banned-api."pandera.typing.DataFrame".msg = "Use 'pandera.typing.pandas.DataFrame' instead of 'pandas.DataFrame' to avoid warnings."
flake8-tidy-imports.banned-api."pins.board_folder".msg = """\
  Don't use pins.board_folder, use pins.board('file', ...) to get caching; see \
  https://github.com/rstudio/pins-python/issues/326\
  """
# src/landloss/ and steps/ never import from a research/ folder (see "Research
# scripts" in AGENTS.md). banned-api takes no wildcards, so every research
# package is listed by name; banning one also bans its submodules and relative
# imports of it.
flake8-tidy-imports.banned-api."scripts.landloss.hazard.research".msg = "Research code is not maintained; nothing outside research/ may import from it."
flake8-tidy-imports.banned-api."scripts.landloss.hazard.landslide.research".msg = "Research code is not maintained; nothing outside research/ may import from it."
flake8-tidy-imports.banned-api."scripts.landloss.vul.research".msg = "Research code is not maintained; nothing outside research/ may import from it."
flake8-import-conventions.banned-from = ["ruru"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
  "ANN",     # We don't need annotations in tests
  "ARG",     # Fixtures used for their side effects, and stubs accepting any call
  "D",       # We don't need docstrings in tests
  "S101",    # Using assert is fine in tests
  "FBT001",  # Fine for fixtures
  "INP",     # Tests don't need __init__.py files
]
".agents/skills/**/*.py" = [
  "INP",     # Standalone skill scripts, not an importable package
  "ANN",     # A skill script may run under another interpreter (QGIS's Python), whose types the repo venv cannot import to annotate against
  "PLC0415", # Imports are deferred on purpose, so a script stays cheap to --help and importable without every optional dependency present
  "FBT003",  # Third-party APIs called from skill scripts (Qt, QGIS) take positional booleans
]
"release_updates/**/*.py" = [
  "INP",     # Standalone tooling beside the weekly update, not a package
]
"src/landloss/io/**" = [
  "A005",    # Only ever imported as landloss.io, so it shadows nothing
]
"!tests/**/*py" = [
  "PT015",   # This is pytest specific and not applicable outside of the tests directory
  "T201",    # Print statements forbidden in tests but not elsewhere
]
"**/__init__.py" = [
  "D104", # Don't need a docstring in (usually empty) __init__.py files
  "F403", # We often use * imports in __init__.py files
  "F405", # We often use * imports in __init__.py files
]
# We aren't as strict about code quality in notebooks and scripts
"src/{scripts,notebooks}/**" = [
  "ANN",     # Annotations
  "ARG001",  # Unused function arguments
  "BLE001",  # OK to catch blind exceptions
  "D",       # Documentation
  "E501",    # Line length
  "INP001",  # __init__.py not applicable for standalone scripts anyway
  "S101",    # Asserts fine in scripts and notebooks
  "T201",    # Prints fine in scripts and notebooks
  "B018",    # "Useless" expressions are used for displaying cell outputs
  "FBT",     # Defensive programming techniques for function definitions are overkill
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-builtins]
strict-checking = true

[tool.deptry]
extend_exclude = ["src/notebooks", "src/scripts", "src/archive"]
experimental_namespace_package = true

[tool.deptry.per_rule_ignores]
# Used only by scripts under src/scripts, which deptry does not scan: PyYAML
# writes the YAML the technical report reads its numbers from.
DEP002 = ["pyyaml"]

[tool.sync-with-uv.repo-to-package]
"https://github.com/astral-sh/uv-pre-commit" = "uv"
# 0.26 is on PyPI but has no matching GitHub tag, so syncing the rev breaks the
# hook clone. Re-enable (delete this line) once upstream tags v0.26.
"https://github.com/abravalheri/validate-pyproject" = ""

[tool.pytest.ini_options]
testpaths = [ "tests", "src" ]
norecursedirs = ["tests/assets", "src/notebooks", "src/scripts", "src/archive", '.*', 'dist', 'build', '{arch}' ]
addopts = [
  "--import-mode=importlib",
  "-ra",
  "--strict-config",
  "--strict-markers",
  "--doctest-modules",
]
console_output_style = "progress"
filterwarnings = [ "error" ]
xfail_strict = true
log_cli_level = "INFO"
doctest_optionflags = "NORMALIZE_WHITESPACE"

[tool.usethis]
sonarqube.exclusions=[
  "**/Dockerfile",
  "src/notebooks/**/*",
  "src/scripts/**/*",
  "src/archive/**/*",
]

[tool.usethis.sonarqube.extra-properties]
"sonar.python.ruff.reportPaths" = "ruff-report.json"

[tool.coverage.run]
source = ["src"]
omit = ["*/pytest-of-*/*", "*/_version.py", "src/archive/*"]

[tool.coverage.report]
ignore_errors = true
show_missing = true
exclude_lines = [
  # Don't complain if tests don't hit defensive assertion code:
  "raise AssertionError",
  "raise NotImplementedError",
  "AbstractMethodError",
  # Don't complain if non-runnable code isn't run:
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
  "if 0:",
  # Don't complain about missing debug-only code:
  "def __repr__",
  "if self\\.debug",
  # Don't complain about abstract methods, they aren't run:
  "@(abc\\.)?abstractmethod",
]

[tool.coverage.xml]
output = "test-reports/coverage.xml"

# Sync with README.md
[[tool.towncrier.type]]
directory = "feature"
name = "Features"
showcontent = true
[[tool.towncrier.type]]
directory = "bugfix"
name = "Bugfixes"
showcontent = true
[[tool.towncrier.type]]
directory = "doc"
name = "Improved Documentation"
showcontent = true
[[tool.towncrier.type]]
directory = "removal"
name = "Deprecations and Removals"
showcontent = true
[[tool.towncrier.type]]
directory = "newhome"
name = "Renamings and Relocations"
showcontent = true
[[tool.towncrier.type]]
directory = "test"
name = "Improved Test Suite"
showcontent = true
[[tool.towncrier.type]]
directory = "devconfig"
name = "Developer Configuration"
showcontent = true
