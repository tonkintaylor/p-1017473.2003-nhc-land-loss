[[assumptions]]
id = "LS-A49"
step = "fragility"
title = "What the unwalled curve is calibrated to"
text = "The Kaikōura area share (A16: 0.001 of non-flat ground at 0.15 g, weighted equal to the polygon anchors together) and polygon anchors A17 to A21. The Kingsbury anchors A01 to A15 are not fitted; A12 is an upper limit only. The review read A16, A19 and A21 as too strong and proposed the 2013 Cook Strait earthquakes as a low-demand anchor; neither change is made."
status = "decided"
decided = "the lead, 2026-10-07 (targets); anchor readings open"
source = "io/assets/urban-fragility-anchors.csv; urban/area_calibration.py; .agents/plans/anchoring-and-calibrating-the-urban-fragilities.md"

[[assumptions]]
id = "LS-A50"
step = "realisation"
title = "One uniform per wall; a wall fails if any of its polygons fails"
text = "See RW-A25."
status = "decided"
decided = "the lead, 2026-10-02"
see = "RW-A25"
source = "gen_urban_slope_realisation.py"

[[assumptions]]
id = "LS-A51"
step = "realisation"
title = "Unwalled polygons fail independently; no retrogression"
text = "No spatial correlation between urban polygons. slope_polygons builds retrogression links with a conditional probability of {BETA_RETROGRESSION_P} (BETA_RETROGRESSION_P), but landslide step 6 never reads them."
status = "check"
source = "slope_polygons.py (conditional_failure_probability); gen_urban_slope_realisation.py"

[[assumptions]]
id = "LS-A52"
step = "realisation"
title = "Large failures supersede, larger urban failures absorb"
text = "A failed urban polygon sharing more than 0.01 m² of evacuated ground with a large failure is superseded; survivors are then resolved largest first and a smaller overlapping one is absorbed. A polygon that did not fail stays standing even under a large slide. Evacuated ground never overlaps across the two populations; inundated and imminent ground may."
status = "decided"
decided = "urban slope build contract, decision 35"
source = "gen_urban_slope_realisation.py (SHARED_GROUND_TOLERANCE_M2)"

[[assumptions]]
id = "LS-A53"
step = "land"
title = "Land damage is evacuated and inundated area in insured land"
text = "Intersected with each property's insured land, the two kinds kept apart; inundated area unioned, depth area-weighted, imminent ground ignored (T-45). Pricing waits on the Rev10 schedule (L-15)."
status = "decided"
source = "vul/landslide/land/steps/s3_landslide_land_damage"

[[assumptions]]
id = "LS-A54"
step = "fragility"
title = "Wall position is fill or cut, nothing else"
text = "A walled polygon is fill_wall where its unit is fill, otherwise cut_wall, so walls on natural or uncertain faces take the ×1.15 cut factor. Not stated in any method file."
status = "check"
source = "face_polygons (wall_position)"

[[assumptions]]
id = "LS-A55"
step = "fragility"
title = "Ground off the map is natural weathered rock"
text = "An element off the ground map (about 15%) takes natural weathered rock, no prior failure and 4 m to groundwater for its Kingsbury rating."
status = "beta"
source = "face_polygons (BETA_OFF_MAP_GROUND)"

[[assumptions]]
id = "LS-A56"
step = "faces"
title = "Steps 6 and 7 are superseded, but step 6 still runs"
text = "Banded slope and aspect patches had no published basis; the zones built by what is now ground step 4 and landslide step 4 replaced old step 7's polygons on 2026-10-06, and steps 6 and 7 were removed on 2026-10-08."
status = "check"
source = "gen_hazard.py; s6_urban_slope_realisation_method.md; s4_slope_faces plan phase 5"

[[assumptions]]
id = "LS-A57"
step = "faces"
title = "Wall height label"
text = "The siz table column near_drop_p80_m holds the 0.7 quantile of near drops within 2 m (config: 0.7, 2 m). This resolves RW-A09's 'check'; the column name is misleading."
status = "check"
see = "RW-A09"
source = "ground s4_slope_faces config; urban-slope-sizs table"

[[assumptions]]
id = "LS-A58"
step = "ground"
title = "Ground map by source precedence"
text = "Each piece takes its material, modification, prior failure, groundwater and strength from the first source in the order SLIDE, 1:50k geology, NLM, WCC earthworks whose polygon contains it. The Wellington Fault sheared zone as crushed rock is proposed, not built."
status = "beta"
source = "landloss.hazard.landslide.ground_map; ground steps/s2_ground_map plan"

[[assumptions]]
id = "LS-A59"
step = "ground"
title = "Mixed fill read as its natural material, fill as the modification"
text = "SLIDE's mixed fill classes take their natural material (colluvium ahead of rock) with fill as the modification; fill strength is the GNS analysis set (φ′ 42°, c′ 2 kPa). Rerun 2026-10-06: fill as material is 17%, fill as modification 74%. Status still says ground step 2 'needs a rerun to see the fill share fall from 71%'."
status = "check"
decided = "the lead, 2026-10-02"
source = "ground_map.py; hazard/landslide/status.md"

[[assumptions]]
id = "LS-A60"
step = "zones"
title = "An unwalled bank evacuates far more than a walled face"
text = "A walled face is cut on a planar slip, with a median depth of about 0.2 m and about 10 m³ on the pilot. With no wall, the same element is a bank: on fill the same slip, no deeper than the fill (since 2026-10-08; it took the whole fill thickness, a median of 2.0 m, before), elsewhere {COLLUVIUM_DEPTH_M} m of cover, a median of about 180 m³. The widths are the same, because the floor sets them all. So drawing a wall shrinks the ground a failure takes, while its curve makes failure more likely. Whether that is the intended trade has not been decided."
status = "check"
source = "slope_polygons.py (element_depth_m, planar_depth_m); urban-slope-zones-{walled,bare}-pilot medians, 2026-10-07"

# ------------------------------------------------------------ walls

[[assumptions]]
id = "LS-A61"
step = "walls"
title = "Wall presence: points prior, GNS floor, claim update"
text = "Each wall unit scores points on ten attributes (verticality, height, length, distance to a building, road frontage or boundary, cut/fill class, rock cut over 2 m, soil cut, wall age, NHC land attributes flag); every {BETA_WALL_POINTS_PER_DOUBLING} points doubles the odds from {BETA_WALL_BASE_P} at zero. A GNS-mapped wall lifts a unit to at least {BETA_GNS_WALL_UNIT_FLOOR} (GNS-only {BETA_GNS_ONLY_WALL_PROBABILITY}), and claim counts raise it further. Whether a face is walled sets both its curve and how much ground it evacuates (LS-A60)."
status = "beta"
note = "Every points value is judgement; the base, floor and GNS-only values are interim (the lead, 2026-10-07) until calibrated against the claim reports (T-50)."
see = "RW-A08, RW-A10, RW-A11, RW-A13"
source = "src/landloss/io/assets/wall-probability-points.csv; wall_units.gen_wall_points, gen_gns_floor, gen_wall_unit_probability"

[[assumptions]]
id = "LS-A62"
step = "walls"
title = "Wall type from age, height and road frontage"
text = "Each drawn wall draws an age bin, moves one bin later with probability {BETA_WALL_REBUILT_SHARE}, and draws its type from the shares for that age bin and height band (under 1.5 m, 1.5 to 2.5 m, over 2.5 m), times the road frontage multipliers where it stands on one. The type picks the wall's fragility curve (LS-A45)."
status = "pending"
note = "The shares and multipliers are placeholders for Nick Peters' review."
see = "RW-A16, RW-A17"
source = "src/landloss/exposure/rw/wall_type.py; beta-retaining-wall-type-shares.csv; beta-retaining-wall-frontage-multipliers.csv"
