text = "Every median is divided by 1 + 0.5 · max(TPI100 / 10, (slope − 30) / 30), clipped, at most {TOPOGRAPHIC_AMPLIFICATION_MAX}. It lifts 99.8% of pilot polygons (median 1.29 unwalled, 1.47 cut-walled). The review proposes 1.0 for most house-lot faces, by height and ridge or terrace setting (Brabhaharan 2018); not built."
