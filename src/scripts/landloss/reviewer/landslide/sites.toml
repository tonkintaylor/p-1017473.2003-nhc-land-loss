# Example sites the landslide reviewer walks through.
#
# These are the twelve stage D2 sites of the slope elements research
# (hazard/landslide/research/slope_elements/config.py, where each is described
# in full), the same windows landslide step 4's FIG_SITES draws, so the reviewer page and
# its figures show the same ground. A site is an NZTM (EPSG:2193) point,
# not an element or polygon id, because ids are minted afresh on each run.
# `why` is the reason the site was chosen (stage D2, 2026-10-03), copied
# 2026-10-07; if a rerun moves the feature away, re-check against it.
#
# No site yet shows a large (landslide step 3) failure: the 2026-10-07 pilot draw placed
# none. Add one when a realisation does.
#
# The first site is the whole pilot (`scale = "pilot"`): the generator sets its
# centre and size from the 10 m DEM and carries only the slope-unit-scale layers
# (rasters, ground map, slope units, failures), so the large-failure steps have a
# map that shows them.

[[sites]]
id = "whole-pilot"
title = "Whole pilot"
scale = "pilot"
why = "The large-failure steps work at slope-unit scale: coverage, slope units and landslide step 3's draw read over the whole extent. House-lot layers are left off at this scale."

[[sites]]
id = "01-wall-soil"
title = "GNS-mapped wall on soil-like ground"
x = 1748714.0
y = 5424998.0
why = "A 72 m free-face 2.9 m high with a GNS mapped wall under it, on soil-like ground, clear of any SLIDE cut or fill."

[[sites]]
id = "02-wall-tall"
title = "Tall wall on weak rock"
x = 1750089.0
y = 5424544.0
why = "A 69 m free-face 4.2 m high with a GNS wall 1.2 m from it, on weak rock: the tallest wall that is not in a cut."

[[sites]]
id = "03-wall-flat"
title = "Stacked terraces"
x = 1750441.0
y = 5425145.0
why = "A GNS wall on a 2 m step with flat ground below and a 9.5 m slope above it: how stacked faces are handled."

[[sites]]
id = "04-road-cut"
title = "Road cut in weak rock"
x = 1748398.0
y = 5425070.0
why = "The pilot's tallest free-face, 15.9 m at 56 degrees on weak rock, inside a SLIDE cut slope with the road at its toe."

[[sites]]
id = "05-excavated-toe"
title = "Excavated toe under a natural slope"
x = 1749009.0
y = 5423918.0
why = "An 11 m free-face on weak rock in a SLIDE cut slope with natural slope above it: where the evacuated ground should run up the slope."

[[sites]]
id = "06-fill-platform"
title = "Fill platform"
x = 1749449.0
y = 5423734.0
why = "A 2.9 ha SLIDE fill body, a flat platform about 100 m across with steep batters on two rims."

