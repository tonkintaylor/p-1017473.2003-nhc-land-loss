# Content of the landslide reviewer page: the overview, the flow diagram, the
# inputs and one table per step. Same schema as reviewer/rw/steps.toml.
#
# First collated 2026-10-07 from the code, configs and pilot outputs (not only
# the status and method prose, several of which lag the code; the assumptions
# marked `check` say where). The retaining wall page covers wall placement,
# p_wall and the wall damage flags in full; this page repeats only the tables
# that set the urban hazard (the points, the type shares and the type curves)
# and points at its RW-A ids for the rest.
#
# `outputs` and `inputs` name keys of layer_files in gen_reviewer_landslide.py.
# `layers` names the map layers drawn for the step (the first `visible` count
# are switched on). `charts` names pilot summaries the generator computes.
# `tables` are CSVs relative to the repository root. `checked` is the date the
# narrative was last checked against the code.

title = "Landslides: large and urban failures, and the land they take"
short = "Landslide reviewer"

overview = """
Earthquake landslides are modelled as two populations that meet in one
realisation:

1. **Large failures** ({LARGE_MIN_SOURCE_AREA_M2} m² of source or more) on natural hillsides. A
   coverage model turns the shaking into an expected failed area per 10 m cell
   (today Hancox et al. 1997 model 3, with Kritikos et al. 2015 and the ESNZ
   grid built as alternatives). Slope units localise it, and step 1 draws
   ellipse-shaped sources and their runout.
2. **Urban failures** on the faces of house lots, road cuts and fills. Sharp
   drops in the 1 m LiDAR DEM (*pips*) are joined into faces (*pifs*), tested
   against a slope table (*sizs*) and grown into *elements*. Each element gets
   evacuated, imminent and inundated zones. Whether a face carries a wall is a
   probability from a points score, a GNS floor and claim counts, drawn per
   exposure world, and a drawn wall's type comes from its age, height and road
   frontage (step 7). Each zone polygon gets a fragility on PGV: the retaining
   wall curve for the wall's type where a wall is drawn, and a Kingsbury rating
   curve where none is.
3. **One draw per earthquake.** Step 9 draws every urban polygon, lets a large
   failure supersede the urban polygons it overlaps and a larger urban failure
   absorb a smaller one, then writes both populations into one layer.
4. **Land damage** is geometric: the evacuated and inundated area, and its
   depth, inside each property's insured land.

The demand is the TS1170.5 2,500-year field per site class (T-26). Where a
model needs a magnitude and distance it takes Mw {BETA_SCENARIO_MW} at {BETA_SITE_DISTANCE_KM} km.

The 2026-10-07 pilot run places **no large failure** (Hancox gives about 1.3
expected over the pilot), so the pilot exercises the urban chain only. The
urban chain still fails far too much ground: **64% of polygons, 12.9% of the
non-flat pilot**, against the order of 0.1 to 1% the literature gives. The
fitted fragility that should bring this down has run as a validation but is not
yet in the code (LS-A32).
"""

[flow]
edges = [
    ["dem", "terrain"],
    ["geology", "ground"], ["terrain", "ground"],
    ["terrain", "units"], ["ground", "units"],
    ["terrain", "coverage"], ["ground", "coverage"], ["shaking", "coverage"],
    ["coverage", "large"], ["units", "large"], ["terrain", "large"],
    ["dem", "faces"], ["ground", "faces"],
    ["faces", "walls"], ["faces", "zones"], ["walls", "zones"],
    ["zones", "fragility"], ["walls", "fragility"], ["ground", "fragility"], ["shaking", "fragility"],
    ["fragility", "realisation"], ["large", "realisation"], ["shaking", "realisation"],
    ["realisation", "land"],
    ["land", "loss"],
]

