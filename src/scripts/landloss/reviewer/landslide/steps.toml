[[inputs]]
name = "LiDAR DEM and DSM, 1 m"
source = "LINZ elevation STAC catalogue (LiDAR where flown, 8 m contour DEM elsewhere), mosaicked by landslide step 3"
licence = "CC BY 4.0: attribute LINZ in anything derived and published."
used_by = "Terrain grids, faces, zones, every model's slope"
file = "dem_1m"

[[inputs]]
name = "GNS SLIDE morphology and materials"
source = "GNS Science / MBIE via Koordinates layers 125308 and 125309"
licence = "No licence on the service; credit GNS/MBIE and confirm with GNS before delivery."
used_by = "Ground map, wall evidence, checks against breaks in slope"

[[inputs]]
name = "GNS 1:50k Wellington urban geology"
source = "GNS GeoServer"
licence = "CC BY 3.0 NZ"
used_by = "Ground map"

[[inputs]]
name = "WCC cut and fill areas"
source = "Wellington City Council"
