# Example sites the retaining wall reviewer walks through.
#
# A site is a point in NZTM (EPSG:2193), not a wall unit id: unit ids are
# minted afresh each time ground step 3 and exposure rw step 6 run, so an id would point at a
# different wall after a rerun, while a place stays put. Each layer is cut to
# a square of side 2 x SITE_HALF_WIDTH_M around the point, so the page shows
# whatever the current build has there. `why` says what the site was chosen to
# show when it was added (2026-10-07); if a rerun moves that feature away, the
# page still draws the site and the `why` line is what to re-check.

[[sites]]
id = "fill-road-frontage"
title = "Fill wall on a road frontage"
x = 1748364.0
y = 5424000.0
why = "Ground step 5 fill pifs along a road frontage, scored up by the points prior, walled in world 0 and failing with their polygon in realisation 0."

