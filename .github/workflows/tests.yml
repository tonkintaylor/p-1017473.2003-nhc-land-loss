name: Tests
permissions: {}
on:
    workflow_dispatch:
    push:
        branches: ["main"]
        paths-ignore:
            - "doc/**"
            - "**/*.md"
    pull_request:
        paths-ignore:
            - "doc/**"
            - "**/*.md"
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true
jobs:
    tests:
        name: Run
        runs-on: "ubuntu-latest"
        permissions:
            contents: read # Required to checkout the test suite
        env:
            PYTHONIOENCODING: utf-8
        steps:
            - name: Checkout code
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  persist-credentials: false

            # ttpy-gis installs from a private Bitbucket repo over SSH. Add a read-only
            # Bitbucket access key for ttpy-gis as the `BITBUCKET_SSH_KEY` repo secret.
            - name: Set up SSH for Bitbucket git dependencies
              uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
              with:
                  ssh-private-key: ${{ secrets.BITBUCKET_SSH_KEY }}

            - name: Trust bitbucket.org host key
              run: |
                  mkdir -p ~/.ssh
                  ssh-keyscan -t rsa,ecdsa,ed25519 bitbucket.org >> ~/.ssh/known_hosts

            - name: Set up uv
              uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
              with:
                  version: latest

            - name: Setup dependencies
              run: uv sync

            - name: Run pytest
              uses: pavelzw/pytest-action@510c5e90c360a185039bea56ce8b3e7e51a16507 # v2.2.0
              with:
                  emoji: false
                  job-summary: false
                  custom-pytest: uv run --frozen pytest --cov --junitxml=junit.xml -o junit_family=legacy --cov-report=xml

            - name: Upload coverage reports
              uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
              with:
                  name: coverage-reports
                  path: coverage.xml


