name: Static Checks
permissions: {}
on:
    workflow_dispatch:
    push:
        branches: ["main"]
        paths-ignore:
            - "doc/**"
            - "**/*.md"
    pull_request:
        paths-ignore:
            - "doc/**"
            - "**/*.md"
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true
jobs:
    analyze:
        name: Run
        runs-on: "ubuntu-latest"
        permissions:
            contents: read # Required to checkout for analysing the code
        steps:
            - name: Checkout code
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  persist-credentials: false

            # ttpy-gis installs from a private Bitbucket repo over SSH. Add a read-only
            # Bitbucket access key for ttpy-gis as the `BITBUCKET_SSH_KEY` repo secret.
            - name: Set up SSH for Bitbucket git dependencies
              uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
              with:
                  ssh-private-key: ${{ secrets.BITBUCKET_SSH_KEY }}

            - name: Trust bitbucket.org host key
              run: |
                  mkdir -p ~/.ssh
                  ssh-keyscan -t rsa,ecdsa,ed25519 bitbucket.org >> ~/.ssh/known_hosts

            - name: Set up uv
              uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
              with:
                  version: latest

            - name: Run checks
              run: uv run --frozen prek -a
              env:
                  PREK_UV_SOURCE: github

            - name: Check for TODOs
              run: uv run ruff check --select "FIX" # Disabled in pre-commit
