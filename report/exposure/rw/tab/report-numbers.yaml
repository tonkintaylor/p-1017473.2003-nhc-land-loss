  points:
  - attribute: verticality
    bin: under 0.4
    lower: .nan
    upper: 0.4
    points: -20
    reason: 'A batter, not a step: the drop in the first cell is under 40% of the
      drop within three (GNS rate 0.13, x0.54)'
  - attribute: verticality
    bin: 0.4 to 0.5
    lower: 0.4
    upper: 0.5
    points: -5
    reason: Between a batter and a step
  - attribute: verticality
    bin: 0.5 and over
    lower: 0.5
    upper: .nan
    points: 10
    reason: 'A step: most of the drop is in the first cell (GNS rate up to 0.33)'
  - attribute: height
    bin: under 1.0 m
    lower: .nan
    upper: 1.0
    points: -5
    reason: A low face (0.7 to 1.0 m) is less often a wall worth building
  - attribute: height
    bin: 1.0 to 2.5 m
    lower: 1.0
    upper: 2.5
    points: 0
    reason: The usual residential wall
  - attribute: height
    bin: 2.5 to 5 m
    lower: 2.5
    upper: 5.0
    points: 5
    reason: A tall face needs retaining; kept small because GNS sees tall walls more
      easily
  - attribute: height
    bin: 5 to 8 m
    lower: 5.0
    upper: 8.0
    points: -20
    reason: Rarely retained in full on a residential lot (replaces the tall face taper)
  - attribute: height
    bin: 8 m and over
    lower: 8.0
    upper: .nan
    points: -60
    reason: A cut slope or natural face, not a wall
  - attribute: length
    bin: under 5 m
    lower: .nan
    upper: 5.0
    points: -5
    reason: Often a fragment of a face (the lead, 2026-10-07)
  - attribute: length
    bin: 5 m and over
    lower: 5.0
    upper: .nan
    points: 0
    reason: .nan
  - attribute: building
    bin: under 2 m
    lower: .nan
    upper: 2.0
    points: 10
    reason: Walls hold house platforms (GNS rate 0.30 within 2 m)
  - attribute: building
    bin: 2 to 5 m
    lower: 2.0
    upper: 5.0
    points: 5
    reason: .nan
  - attribute: building
    bin: 5 to 20 m
    lower: 5.0
    upper: 20.0
    points: 0
    reason: .nan
  - attribute: building
    bin: 20 m and over
    lower: 20.0
    upper: .nan
    points: -20
    reason: Far from a building (GNS rate 0.06 at 20 to 50 m); also where no building
      is within the search distance
  - attribute: setting
    bin: road_frontage
    lower: .nan
    upper: .nan
    points: 20
    reason: Mostly within 2 m of a road parcel's boundary (GNS rate 0.48 against 0.20);
      below the raw value, as frontage walls are easy to see
  - attribute: setting
    bin: property_boundary
    lower: .nan
    upper: .nan
    points: 10
    reason: Mostly within 2 m of a non-road property boundary (GNS rate 0.32 against
      0.17)
  - attribute: class
    bin: fill
    lower: .nan
    upper: .nan
    points: 5
    reason: 'Ground step 5 fill: the front of a platform'
  - attribute: class
    bin: cut_and_fill
    lower: .nan
    upper: .nan
    points: 5
    reason: 'Ground step 5 cut and fill: a benched face with fill at its crest'
  - attribute: class
    bin: natural
    lower: .nan
    upper: .nan
    points: -15
    reason: 'Ground step 5 natural: a bank, not an earthwork (GNS rate 0.14)'
  - attribute: rock_cut
    bin: cut in rock over 2.0 m
    lower: 2.0
    upper: .nan
    points: -20
    reason: A cut in unweathered or moderately weathered rock deeper than 2.0 m stands
      unsupported (the lead, 2026-10-07)
  - attribute: soil_cut
    bin: cut in soil
    lower: .nan
    upper: .nan
    points: 10
    reason: A cut in soil (alluvium, loess, colluvium, fill, or highly or completely
      weathered or crushed rock) needs retaining (the lead, 2026-10-07)
  - attribute: age
    bin: pre_1970
    lower: .nan
    upper: .nan
    points: -10
    reason: Share of the property's walls before 1970
  - attribute: age
    bin: '1970_1991'
    lower: .nan
    upper: .nan
    points: -5
    reason: Share 1970 to 1991
  - attribute: age
    bin: '1992_2004'
    lower: .nan
    upper: .nan
    points: 0
    reason: Share 1992 to 2004
  - attribute: age
    bin: 2005_on
    lower: .nan
    upper: .nan
    points: 10
    reason: Share 2005 on
  - attribute: nhc_land_attrs
    bin: flagged
    lower: .nan
    upper: .nan
    points: 5
    reason: 'NHC land attributes says the property has a retaining wall: a yes/no
      with no count, agreeing with GNS no better than chance (kappa 0.03)'
